apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  dashboard-providers.yaml: |
    apiVersion: 1
    providers:
      - name: 'Anime Recommender Dashboards'
        orgId: 1
        folder: 'AI Recommender'
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-anime
  namespace: monitoring
data:
  anime-recommender-dashboard.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "title": "Total HTTP Requests",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(anime_rec_http_requests_total) or vector(0)",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {"values": false, "calcs": ["lastNotNull"]},
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "id": 2,
          "title": "Total AI Inferences",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(anime_rec_inference_total) or vector(0)",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {"values": false, "calcs": ["lastNotNull"]},
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "id": 3,
          "title": "Model Status",
          "type": "stat",
          "targets": [
            {
              "expr": "anime_rec_model_loaded_status",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {"values": false, "calcs": ["lastNotNull"]},
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {"options": {"0": {"text": "OFFLINE", "color": "red"}}, "type": "value"},
                {"options": {"1": {"text": "ACTIVE", "color": "green"}}, "type": "value"}
              ]
            }
          }
        },
        {
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "id": 4,
          "title": "Inference Latency P95 (ms)",
          "type": "stat",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(anime_rec_inference_latency_seconds_bucket[1m])) by (le)) * 1000 or vector(0)",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {"values": false, "calcs": ["lastNotNull"]},
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "id": 5,
          "title": "AI Recommendation Request Throughput (req/s)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(anime_rec_http_requests_total[1m])) by (endpoint)",
              "legendFormat": "{{endpoint}}",
              "refId": "A"
            }
          ]
        },
        {
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "id": 6,
          "title": "Inferences by Recommender Type",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(anime_rec_inference_total) by (recommender_type)",
              "legendFormat": "Type: {{recommender_type}}",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": ["anime-recommender", "ai", "machine-learning"],
      "timezone": "browser",
      "title": "Hybrid Anime Recommender AI Operations Dashboard",
      "uid": "anime-rec-ai-telemetry",
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-deployment
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin123"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources/
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/
            - name: grafana-dashboard-anime
              mountPath: /var/lib/grafana/dashboards/
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: grafana-dashboard-anime
          configMap:
            name: grafana-dashboard-anime
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: monitoring
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
