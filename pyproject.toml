[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-anime-recommender"
version = "0.1.0"
description = "Hybrid Anime Recommender System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=26.10.1",
    "chromadb>=1.5.9",
    "comet-ml>=3.58.8",
    "dvc>=3.67.1",
    "dvc-gs>=3.1.0",
    "flake8>=7.4.1",
    "flask>=3.1.3",
    "google-cloud-storage>=3.17.0",
    "joblib>=1.6.0",
    "kaggle>=2.2.4",
    "kfp>=2.17.0",
    "langchain>=1.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "mypy>=2.4.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "prometheus-client>=0.26.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sentence-transformers>=6.1.0",
    "setuptools>=84.0.0",
    "tensorflow>=2.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "pipeline*", "utils*", "config*"]
