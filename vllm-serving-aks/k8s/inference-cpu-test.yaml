apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-cpu-mock
  labels:
    app: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      enableServiceLinks: false
      # Runs on the system CPU node pool (Standard_D2s_v3) without GPU taints or quota
      containers:
        - name: inference-mock
          image: python:3.11-slim
          command:
            - python3
            - -c
            - |
              import http.server
              import socketserver
              import json
              import sys

              class MockInferenceHandler(http.server.SimpleHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == "/health":
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.end_headers()
                          self.wfile.write(b'{"status":"ok"}')
                      elif self.path == "/v1/models":
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.end_headers()
                          self.wfile.write(json.dumps({
                              "data": [{"id": "Qwen/Qwen2.5-7B-Instruct-AWQ", "object": "model"}]
                          }).encode("utf-8"))
                      else:
                          self.send_response(404)
                          self.end_headers()

                  def do_POST(self):
                      if self.path in ["/v1/completions", "/v1/chat/completions"]:
                          content_len = int(self.headers.get("Content-Length", 0))
                          body = self.rfile.read(content_len).decode("utf-8") if content_len > 0 else "{}"
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.end_headers()
                          response = {
                              "id": "cmpl-mock-korea-central",
                              "object": "text_completion",
                              "model": "Qwen/Qwen2.5-7B-Instruct-AWQ",
                              "choices": [{
                                  "text": " Antigravity LLMOps & Hybrid Anime Recommender: Serving live on AKS Korea Central!",
                                  "index": 0,
                                  "finish_reason": "stop"
                              }],
                              "usage": {"prompt_tokens": 8, "completion_tokens": 16, "total_tokens": 24}
                          }
                          self.wfile.write(json.dumps(response).encode("utf-8"))
                      else:
                          self.send_response(404)
                          self.end_headers()

              server = socketserver.TCPServer(("0.0.0.0", 8000), MockInferenceHandler)
              print("Mock OpenAI API serving on port 8000...")
              sys.stdout.flush()
              server.serve_forever()
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 3
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
spec:
  type: ClusterIP
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
