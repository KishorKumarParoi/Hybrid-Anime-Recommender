apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-multilora
  labels:
    app: vllm-multilora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-multilora
  template:
    metadata:
      labels:
        app: vllm-multilora
    spec:
      enableServiceLinks: false
      nodeSelector:
        workload: gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: sync-lora-adapters
          image: mcr.microsoft.com/cbl-mariner/base/core:2.0
          command:
            - /bin/sh
            - -c
            - |
              echo "=== Synchronizing Multi-LoRA Adapters for AKS ==="
              mkdir -p /data/adapters/anime-critic-lora /data/adapters/anime-stylist-lora
              echo '{"base_model_name_or_path":"Qwen/Qwen2.5-7B-Instruct-AWQ","lora_alpha":32,"lora_dropout":0.05,"r":16,"target_modules":["q_proj","v_proj","k_proj","o_proj"]}' > /data/adapters/anime-critic-lora/adapter_config.json
              echo '{"base_model_name_or_path":"Qwen/Qwen2.5-7B-Instruct-AWQ","lora_alpha":32,"lora_dropout":0.05,"r":16,"target_modules":["q_proj","v_proj","k_proj","o_proj"]}' > /data/adapters/anime-stylist-lora/adapter_config.json
              echo "LoRA adapter manifests staged in /data/adapters"
          volumeMounts:
            - name: lora-adapters-volume
              mountPath: /data/adapters
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.3
          # Azure Standard_NC4as_T4_v3 (NVIDIA T4 16GB, Turing SM 7.5):
          # - awq (standard GEMM kernels, not Marlin which requires SM 8.0+)
          # - float16 (Turing has no native bfloat16)
          # - enforce-eager (preserves KV cache headroom on 16GB cards)
          # - max-model-len 4096 / max-num-seqs 8
          args:
            - --model=Qwen/Qwen2.5-7B-Instruct-AWQ
            - --quantization=awq
            - --dtype=float16
            - --enforce-eager
            - --gpu-memory-utilization=0.90
            - --max-model-len=4096
            - --max-num-seqs=8
            - --port=8000
            # === DYNAMIC MULTI-LORA SERVING CONFIGURATION ===
            - --enable-lora
            - --max-loras=4
            - --max-lora-rank=32
            - --lora-modules
            - anime-critic=/data/adapters/anime-critic-lora
            - anime-stylist=/data/adapters/anime-stylist-lora
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "1"
              memory: 8Gi
            limits:
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: lora-adapters-volume
              mountPath: /data/adapters
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: lora-adapters-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-multilora
spec:
  type: ClusterIP
  selector:
    app: vllm-multilora
  ports:
    - name: http
      port: 8000
      targetPort: 8000
