name: Enterprise CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Astral uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Install Dependencies
        run: uv sync

      - name: Lint with Flake8
        run: |
          uv run flake8 src/ app/ pipeline/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          uv run flake8 src/ app/ pipeline/ tests/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

  terraform-validate:
    name: Terraform IaC Validation (AWS, GCP, Azure)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Validate AWS Infrastructure
        run: |
          terraform -chdir=terraform/aws init -backend=false
          terraform -chdir=terraform/aws validate

      - name: Validate GCP Infrastructure
        run: |
          terraform -chdir=terraform/gcp init -backend=false
          terraform -chdir=terraform/gcp validate

      - name: Validate Azure Streaming Infrastructure
        run: |
          terraform -chdir=terraform/azure init -backend=false
          terraform -chdir=terraform/azure validate

  test-and-coverage:
    name: Automated Unit & Integration Tests (pytest)
    runs-on: ubuntu-latest
    needs: [lint-and-code-quality, terraform-validate]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Astral uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Install Dependencies
        run: uv sync

      - name: Run Test Suite with Pytest
        env:
          GROQ_API_KEY: "mock_groq_key"
          OPENAI_API_KEY: "mock_openai_key"
          KAFKA_BOOTSTRAP_SERVERS: "localhost:9092"
        run: |
          uv run pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

  docker-build-and-scan:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [test-and-coverage]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Application Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: hybrid-anime-recommender:ci-test
          load: true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "hybrid-anime-recommender:ci-test"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
