apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hybrid-anime-recommender
  namespace: argocd
  labels:
    app: hybrid-anime-recommender
spec:
  project: default
  source:
    repoURL: https://github.com/KishorKumarParoi/Hybrid-Anime-Recommender.git
    targetRevision: HEAD
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
