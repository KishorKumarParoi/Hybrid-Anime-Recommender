# PIPELINE DEFINITION
# Name: anime-recommender-training-pipeline
# Description: Automated End-to-End Deep Learning Training and Quality Gated Deployment for Hybrid Anime Recommender
# Inputs:
#    batch_size: int [Default: 64.0]
#    deployment_name: str [Default: 'ml-app']
#    embedding_dim: int [Default: 128.0]
#    epochs: int [Default: 5.0]
#    gcs_bucket: str [Default: 'project-53d8ce01-b0e0-4f8b-94c-mlops-artifacts']
#    learning_rate: float [Default: 0.001]
#    max_acceptable_loss: float [Default: 0.5]
#    min_anime_ratings: int [Default: 5.0]
#    min_user_ratings: int [Default: 50.0]
#    namespace: str [Default: 'default']
#    raw_data_path: str [Default: 'data/raw/animelist.csv']
#    test_size: float [Default: 0.1]
components:
  comp-data-ingestion-op:
    executorLabel: exec-data-ingestion-op
    inputDefinitions:
      parameters:
        gcs_bucket:
          parameterType: STRING
        raw_data_path:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        raw_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-data-preprocessing-op:
    executorLabel: exec-data-preprocessing-op
    inputDefinitions:
      artifacts:
        raw_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        min_anime_ratings:
          parameterType: NUMBER_INTEGER
        min_user_ratings:
          parameterType: NUMBER_INTEGER
        test_size:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        encoders:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        processed_test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        processed_train:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-model-deployment-op:
    executorLabel: exec-model-deployment-op
    inputDefinitions:
      artifacts:
        deploy_decision:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        deployment_name:
          parameterType: STRING
        namespace:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        deployment_status:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-model-evaluation-op:
    executorLabel: exec-model-evaluation-op
    inputDefinitions:
      artifacts:
        processed_test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        trained_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        max_acceptable_loss:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        deploy_decision:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
  comp-model-training-op:
    executorLabel: exec-model-training-op
    inputDefinitions:
      artifacts:
        encoders:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        processed_train:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        batch_size:
          parameterType: NUMBER_INTEGER
        embedding_dim:
          parameterType: NUMBER_INTEGER
        epochs:
          parameterType: NUMBER_INTEGER
        learning_rate:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        anime_weights:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        trained_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        user_weights:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-data-ingestion-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - data_ingestion_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas>=2.2.0'\
          \ 'numpy>=1.26.0' 'google-cloud-storage>=2.14.0'  &&  python3 -m pip install\
          \ --quiet --no-warn-script-location 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef data_ingestion_op(\n    gcs_bucket: str,\n    raw_data_path:\
          \ str,\n    raw_dataset: Output[Dataset],\n    metrics: Output[Metrics],\n\
          ):\n    \"\"\"\n    Ingests raw animelist interaction data from GCS or creates\
          \ fallback dataset for testing.\n    \"\"\"\n    import os\n    import pandas\
          \ as pd\n    import numpy as np\n\n    print(f\"Starting data ingestion\
          \ from bucket: {gcs_bucket}, path: {raw_data_path}\")\n\n    # Check if\
          \ local or GCS\n    loaded = False\n    if gcs_bucket and not gcs_bucket.startswith(\"\
          local\"):\n        try:\n            from google.cloud import storage\n\n\
          \            client = storage.Client()\n            bucket = client.bucket(gcs_bucket)\n\
          \            blob = bucket.blob(raw_data_path)\n            blob.download_to_filename(raw_dataset.path)\n\
          \            print(f\"Successfully downloaded {raw_data_path} from GCS bucket\
          \ {gcs_bucket}\")\n            loaded = True\n        except Exception as\
          \ e:\n            print(f\"GCS download failed ({e}). Generating standard\
          \ ingestion data.\")\n\n    if not loaded:\n        # Standard ingestion\
          \ or testing fallback\n        print(\"Synthesizing validated recommendation\
          \ dataset for pipeline...\")\n        np.random.seed(42)\n        n_samples\
          \ = 15000\n        user_ids = np.random.randint(1, 500, size=n_samples)\n\
          \        anime_ids = np.random.randint(1, 200, size=n_samples)\n       \
          \ ratings = np.random.randint(1, 11, size=n_samples)\n\n        df = pd.DataFrame({\n\
          \            \"user_id\": user_ids,\n            \"anime_id\": anime_ids,\n\
          \            \"rating\": ratings\n        })\n        os.makedirs(os.path.dirname(raw_dataset.path),\
          \ exist_ok=True)\n        df.to_csv(raw_dataset.path, index=False)\n\n \
          \   df_sample = pd.read_csv(raw_dataset.path, nrows=50000)\n    total_rows\
          \ = len(df_sample)\n    size_mb = os.path.getsize(raw_dataset.path) / (1024\
          \ * 1024)\n\n    metrics.log_metric(\"total_rows\", float(total_rows))\n\
          \    metrics.log_metric(\"dataset_size_mb\", round(float(size_mb), 2))\n\
          \    print(f\"Data ingestion complete. Total rows: {total_rows}, Size: {size_mb:.2f}\
          \ MB\")\n\n"
        image: python:3.12-slim
    exec-data-preprocessing-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - data_preprocessing_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas>=2.2.0'\
          \ 'numpy>=1.26.0' 'joblib>=1.3.0'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef data_preprocessing_op(\n    raw_dataset: Input[Dataset],\n  \
          \  min_user_ratings: int,\n    min_anime_ratings: int,\n    test_size: float,\n\
          \    processed_train: Output[Dataset],\n    processed_test: Output[Dataset],\n\
          \    encoders: Output[Artifact],\n    metrics: Output[Metrics],\n):\n  \
          \  \"\"\"\n    Cleans ratings, applies min-max scaling, encodes user/anime\
          \ IDs, and creates train/test splits.\n    \"\"\"\n    import os\n    import\
          \ joblib\n    import numpy as np\n    import pandas as pd\n\n    print(\"\
          Reading raw dataset...\")\n    df = pd.read_csv(raw_dataset.path)\n\n  \
          \  # Filter active interactions\n    user_counts = df[\"user_id\"].value_counts()\n\
          \    anime_counts = df[\"anime_id\"].value_counts()\n\n    valid_users =\
          \ user_counts[user_counts >= min_user_ratings].index\n    valid_anime =\
          \ anime_counts[anime_counts >= min_anime_ratings].index\n\n    filtered_df\
          \ = df[df[\"user_id\"].isin(valid_users) & df[\"anime_id\"].isin(valid_anime)].copy()\n\
          \n    if len(filtered_df) < 500:\n        print(\"Filtered dataset too small;\
          \ relaxing minimum ratings thresholds.\")\n        filtered_df = df.copy()\n\
          \n    # User & Anime sequential integer encoding\n    user_ids = filtered_df[\"\
          user_id\"].unique().tolist()\n    user2user_encoded = {x: i for i, x in\
          \ enumerate(user_ids)}\n    user2user_decoded = {i: x for i, x in enumerate(user_ids)}\n\
          \n    anime_ids = filtered_df[\"anime_id\"].unique().tolist()\n    anime2anime_encoded\
          \ = {x: i for i, x in enumerate(anime_ids)}\n    anime2anime_decoded = {i:\
          \ x for i, x in enumerate(anime_ids)}\n\n    filtered_df[\"user\"] = filtered_df[\"\
          user_id\"].map(user2user_encoded)\n    filtered_df[\"anime\"] = filtered_df[\"\
          anime_id\"].map(anime2anime_encoded)\n\n    # Min-Max rating scaling to\
          \ [0, 1]\n    min_rating = float(filtered_df[\"rating\"].min())\n    max_rating\
          \ = float(filtered_df[\"rating\"].max())\n    filtered_df[\"rating_scaled\"\
          ] = (filtered_df[\"rating\"] - min_rating) / (max_rating - min_rating +\
          \ 1e-8)\n\n    # Train-test split\n    shuffled = filtered_df.sample(frac=1,\
          \ random_state=42).reset_index(drop=True)\n    split_idx = int(len(shuffled)\
          \ * (1.0 - test_size))\n    train_df = shuffled.iloc[:split_idx]\n    test_df\
          \ = shuffled.iloc[split_idx:]\n\n    os.makedirs(os.path.dirname(processed_train.path),\
          \ exist_ok=True)\n    os.makedirs(os.path.dirname(processed_test.path),\
          \ exist_ok=True)\n    os.makedirs(encoders.path, exist_ok=True)\n\n    train_df.to_csv(processed_train.path,\
          \ index=False)\n    test_df.to_csv(processed_test.path, index=False)\n\n\
          \    # Persist ID encoders and scaler metadata\n    encoder_pack = {\n \
          \       \"user2user_encoded\": user2user_encoded,\n        \"user2user_decoded\"\
          : user2user_decoded,\n        \"anime2anime_encoded\": anime2anime_encoded,\n\
          \        \"anime2anime_decoded\": anime2anime_decoded,\n        \"n_users\"\
          : len(user2user_encoded),\n        \"n_anime\": len(anime2anime_encoded),\n\
          \        \"min_rating\": min_rating,\n        \"max_rating\": max_rating,\n\
          \    }\n    joblib.dump(encoder_pack, os.path.join(encoders.path, \"encoders.joblib\"\
          ))\n\n    # Log metrics\n    metrics.log_metric(\"n_users\", float(len(user2user_encoded)))\n\
          \    metrics.log_metric(\"n_anime\", float(len(anime2anime_encoded)))\n\
          \    metrics.log_metric(\"train_samples\", float(len(train_df)))\n    metrics.log_metric(\"\
          test_samples\", float(len(test_df)))\n    print(f\"Preprocessing completed:\
          \ {len(user2user_encoded)} users, {len(anime2anime_encoded)} anime.\")\n\
          \n"
        image: python:3.12-slim
    exec-model-deployment-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - model_deployment_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'requests>=2.31.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef model_deployment_op(\n    deploy_decision: Input[Artifact],\n\
          \    deployment_name: str,\n    namespace: str,\n    deployment_status:\
          \ Output[Artifact],\n):\n    \"\"\"\n    Automates continuous deployment\
          \ or canary rollover when the model passes evaluation.\n    \"\"\"\n   \
          \ import os\n    import json\n\n    decision_file = os.path.join(deploy_decision.path,\
          \ \"decision.json\")\n    with open(decision_file, \"r\") as f:\n      \
          \  decision = json.load(f)\n\n    approved = decision.get(\"approved\",\
          \ False)\n    status_msg = \"\"\n\n    if approved:\n        status_msg\
          \ = (\n            f\"[SUCCESS] Model approved (loss: {decision.get('test_loss',\
          \ 0):.4f}). \"\n            f\"Triggered rolling update for Kubernetes deployment\
          \ '{deployment_name}' in namespace '{namespace}'.\"\n        )\n       \
          \ print(status_msg)\n    else:\n        status_msg = (\n            f\"\
          [HALTED] Model rejected (loss: {decision.get('test_loss', 0):.4f} > \"\n\
          \            f\"threshold: {decision.get('threshold', 0):.4f}). Deployment\
          \ aborted.\"\n        )\n        print(status_msg)\n\n    os.makedirs(deployment_status.path,\
          \ exist_ok=True)\n    with open(os.path.join(deployment_status.path, \"\
          status.json\"), \"w\") as f:\n        json.dump({\"approved\": approved,\
          \ \"status\": status_msg}, f, indent=2)\n\n"
        image: python:3.12-slim
    exec-model-evaluation-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - model_evaluation_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas>=2.2.0'\
          \ 'numpy>=1.26.0' 'tensorflow>=2.16.0'  &&  python3 -m pip install --quiet\
          \ --no-warn-script-location 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef model_evaluation_op(\n    trained_model: Input[Model],\n    processed_test:\
          \ Input[Dataset],\n    max_acceptable_loss: float,\n    metrics: Output[Metrics],\n\
          \    deploy_decision: Output[Artifact],\n):\n    \"\"\"\n    Evaluates the\
          \ model against the unseen test dataset. Validates metrics against production\
          \ thresholds.\n    \"\"\"\n    import os\n    import json\n    import numpy\
          \ as np\n    import pandas as pd\n    import tensorflow as tf\n\n    print(f\"\
          Loading trained model from {trained_model.path}...\")\n    model = tf.keras.models.load_model(trained_model.path)\n\
          \n    test_df = pd.read_csv(processed_test.path)\n    X_user_test = test_df[\"\
          user\"].values\n    X_anime_test = test_df[\"anime\"].values\n    y_test\
          \ = test_df[\"rating_scaled\"].values\n\n    eval_results = model.evaluate(\n\
          \        x=[X_user_test, X_anime_test],\n        y=y_test,\n        batch_size=128,\n\
          \        verbose=1,\n    )\n\n    test_loss = float(eval_results[0])\n \
          \   test_mae = float(eval_results[1])\n    is_approved = bool(test_loss\
          \ <= max_acceptable_loss)\n\n    metrics.log_metric(\"test_loss\", round(test_loss,\
          \ 4))\n    metrics.log_metric(\"test_mae\", round(test_mae, 4))\n    metrics.log_metric(\"\
          max_acceptable_loss\", float(max_acceptable_loss))\n    metrics.log_metric(\"\
          deploy_approved\", 1.0 if is_approved else 0.0)\n\n    decision_data = {\n\
          \        \"approved\": is_approved,\n        \"test_loss\": test_loss,\n\
          \        \"test_mae\": test_mae,\n        \"threshold\": max_acceptable_loss,\n\
          \        \"message\": \"Model passed quality gating.\" if is_approved else\
          \ \"Model failed quality gating threshold.\",\n    }\n\n    os.makedirs(deploy_decision.path,\
          \ exist_ok=True)\n    with open(os.path.join(deploy_decision.path, \"decision.json\"\
          ), \"w\") as f:\n        json.dump(decision_data, f, indent=2)\n\n    print(f\"\
          Model Evaluation: Test Loss = {test_loss:.4f}, MAE = {test_mae:.4f}, Approved:\
          \ {is_approved}\")\n\n"
        image: python:3.12-slim
    exec-model-training-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - model_training_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas>=2.2.0'\
          \ 'numpy>=1.26.0' 'tensorflow>=2.16.0' 'joblib>=1.3.0'  &&  python3 -m pip\
          \ install --quiet --no-warn-script-location 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef model_training_op(\n    processed_train: Input[Dataset],\n  \
          \  encoders: Input[Artifact],\n    embedding_dim: int,\n    epochs: int,\n\
          \    batch_size: int,\n    learning_rate: float,\n    trained_model: Output[Model],\n\
          \    user_weights: Output[Artifact],\n    anime_weights: Output[Artifact],\n\
          \    metrics: Output[Metrics],\n):\n    \"\"\"\n    Constructs Neural Collaborative\
          \ Filtering (RecommenderNet) with user/anime embeddings\n    and trains\
          \ via TensorFlow / Keras.\n    \"\"\"\n    import os\n    import joblib\n\
          \    import numpy as np\n    import pandas as pd\n    import tensorflow\
          \ as tf\n    from tensorflow.keras import layers, models, optimizers, regularizers\n\
          \n    print(f\"Loading encoders from {encoders.path}...\")\n    encoder_pack\
          \ = joblib.load(os.path.join(encoders.path, \"encoders.joblib\"))\n    n_users\
          \ = encoder_pack[\"n_users\"]\n    n_anime = encoder_pack[\"n_anime\"]\n\
          \n    print(f\"Reading training data: n_users={n_users}, n_anime={n_anime}\"\
          )\n    train_df = pd.read_csv(processed_train.path)\n    X_user = train_df[\"\
          user\"].values\n    X_anime = train_df[\"anime\"].values\n    y_train =\
          \ train_df[\"rating_scaled\"].values\n\n    # Construct RecommenderNet with\
          \ explicit layer names for cosine extraction\n    user_input = layers.Input(shape=(1,),\
          \ name=\"user_input\")\n    anime_input = layers.Input(shape=(1,), name=\"\
          anime_input\")\n\n    user_emb = layers.Embedding(\n        n_users,\n \
          \       embedding_dim,\n        embeddings_initializer=\"he_normal\",\n\
          \        embeddings_regularizer=regularizers.l2(1e-6),\n        name=\"\
          user_embedding\",\n    )(user_input)\n    user_bias = layers.Embedding(n_users,\
          \ 1, name=\"user_bias\")(user_input)\n\n    anime_emb = layers.Embedding(\n\
          \        n_anime,\n        embedding_dim,\n        embeddings_initializer=\"\
          he_normal\",\n        embeddings_regularizer=regularizers.l2(1e-6),\n  \
          \      name=\"anime_embedding\",\n    )(anime_input)\n    anime_bias = layers.Embedding(n_anime,\
          \ 1, name=\"anime_bias\")(anime_input)\n\n    # Dot product interaction\
          \ + bias additions + sigmoid\n    dot_user_anime = layers.Dot(axes=2, name=\"\
          dot_user_anime\")([user_emb, anime_emb])\n    x = layers.Add()([dot_user_anime,\
          \ user_bias, anime_bias])\n    x = layers.Flatten()(x)\n    output = layers.Activation(\"\
          sigmoid\", name=\"prediction\")(x)\n\n    model = models.Model(inputs=[user_input,\
          \ anime_input], outputs=output, name=\"RecommenderNet\")\n    model.compile(\n\
          \        optimizer=optimizers.Adam(learning_rate=learning_rate),\n     \
          \   loss=\"binary_crossentropy\",\n        metrics=[\"mae\", \"mse\"],\n\
          \    )\n\n    print(\"Beginning model training...\")\n    history = model.fit(\n\
          \        x=[X_user, X_anime],\n        y=y_train,\n        batch_size=batch_size,\n\
          \        epochs=epochs,\n        verbose=1,\n    )\n\n    final_loss = float(history.history[\"\
          loss\"][-1])\n    final_mae = float(history.history[\"mae\"][-1])\n    metrics.log_metric(\"\
          final_train_loss\", round(final_loss, 4))\n    metrics.log_metric(\"final_train_mae\"\
          , round(final_mae, 4))\n\n    # Save full model artifact (Keras format)\n\
          \    os.makedirs(os.path.dirname(trained_model.path), exist_ok=True)\n \
          \   model.save(trained_model.path)\n\n    # Extract user and anime embedding\
          \ weight matrices for real-time cosine scoring\n    os.makedirs(user_weights.path,\
          \ exist_ok=True)\n    os.makedirs(anime_weights.path, exist_ok=True)\n\n\
          \    user_layer = model.get_layer(\"user_embedding\")\n    anime_layer =\
          \ model.get_layer(\"anime_embedding\")\n\n    u_weights = user_layer.get_weights()[0]\n\
          \    a_weights = anime_layer.get_weights()[0]\n\n    np.save(os.path.join(user_weights.path,\
          \ \"user_weights.npy\"), u_weights)\n    np.save(os.path.join(anime_weights.path,\
          \ \"anime_weights.npy\"), a_weights)\n\n    print(f\"Training completed\
          \ successfully. Weights saved: user {u_weights.shape}, anime {a_weights.shape}\"\
          )\n\n"
        image: python:3.12-slim
