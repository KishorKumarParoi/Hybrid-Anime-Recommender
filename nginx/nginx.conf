# ==============================================================================
# ENTERPRISE NGINX REVERSE PROXY & LOAD BALANCER CONFIGURATION
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main_json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log main_json;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting Zones (DDoS & Abuse Mitigation)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ─── Upstream Service Pools ───────────────────────────────────────────────
    upstream frontend_cluster {
        server frontend:3000;
        keepalive 32;
    }

    upstream go_auth_cluster {
        server go-auth:8081;
        keepalive 32;
    }

    upstream express_cluster {
        server express-interactions:8082;
        keepalive 32;
    }

    upstream rust_cluster {
        server rust-scoring:8083;
        keepalive 32;
    }

    upstream fastapi_cluster {
        least_conn;
        server app:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream flask_cluster {
        least_conn;
        server web:5000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream pyrit_cluster {
        server pyrit:8001;
    }

    # ─── HTTP -> HTTPS Gateway & Load Balancer ────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health Probe for AWS ALB / Cloudflare / K8s Ingress
        location /nginx-health {
            access_log off;
            return 200 '{"status":"healthy","proxy":"nginx-edge"}';
            add_header Content-Type application/json;
        }

        # 1. Go Auth Microservice (/api/auth/)
        location /api/auth/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://go_auth_cluster/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Express User Interactions Microservice (/api/interactions/)
        location /api/interactions/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://express_cluster/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Rust SIMD Vector Scoring Engine (/api/score/)
        location /api/score/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://rust_cluster/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. FastAPI Microservices Endpoints (/api/v1/ and /api/python/)
        location /api/v1/ {
            limit_req zone=api_limit burst=30 nodelay;
            limit_conn conn_limit 15;

            proxy_pass http://fastapi_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /api/python/ {
            proxy_pass http://fastapi_cluster/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. PyRIT Automated Red Teaming Dashboard (/pyrit/)
        location /pyrit/ {
            proxy_pass http://pyrit_cluster/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 6. Prometheus Telemetry (/metrics)
        location /metrics {
            proxy_pass http://flask_cluster/metrics;
            proxy_set_header Host $host;
        }

        # 7. Default Application Gateway (Next.js Latest Frontend)
        location / {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
