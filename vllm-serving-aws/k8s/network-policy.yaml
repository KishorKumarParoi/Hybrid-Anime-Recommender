apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm-zero-trust-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: vllm
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only allow incoming inference requests from authorized backend/frontend pods
    - from:
        - podSelector:
            matchLabels:
              role: api-gateway
        - podSelector:
            matchLabels:
              role: frontend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow internet egress for model weights, but EXPLICITLY DENY AWS metadata server (169.254.169.254)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32 # Block AWS EC2 IMDSv2 metadata SSRF credential theft
