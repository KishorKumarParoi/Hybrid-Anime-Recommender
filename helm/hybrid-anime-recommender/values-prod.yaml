# Production GKE / Cloud Cluster configuration
replicaCount: 3

image:
  repository: kishorkumarparoi/hybrid-anime-recommender
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  targetPort: 5000

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

resources:
  requests:
    cpu: 500m
    memory: 1024Mi
  limits:
    cpu: 2000m
    memory: 4096Mi

strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

redis:
  enabled: true
  maxmemory: "1024mb"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
